---
version: '3'
services:
  postgres-testnet:
    container_name: postgres_container-testnet
    image: postgres
    environment:
      POSTGRES_USER: ${TEST_TERRA_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_TERRA_POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
      - postgres-test:/data/postgres
    ports:
      - "${TEST_TERRA_POSTGRES_PORT:-5543}:5432"
    networks:
      - postgres-testnet
    restart: unless-stopped

  terra-defi-testnet:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: on-failure:5
    working_dir: /code
    command: [ "python", "./main.py" ]
    environment:
      DB_HOST: localhost
      DB_PORT: ${TEST_TERRA_POSTGRES_PORT:-5543}
      DB_NAME: ${TEST_TERRA_POSTGRES_DBNAME:-terra_defi}
      DB_USER: ${TEST_TERRA_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${TEST_TERRA_POSTGRES_PASSWORD:-changeme}
      MAINNET: "false"
    network_mode: host
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true
    depends_on:
      - terra-defi-api-testnet

  terra-defi-api-testnet:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: on-failure:5
    working_dir: /code
    command: [ "python", "./web_server.py" ]
    environment:
      DB_HOST: localhost
      DB_PORT: ${TEST_TERRA_POSTGRES_PORT:-5543}
      DB_NAME: ${TEST_TERRA_POSTGRES_DBNAME:-terra_defi}
      DB_USER: ${TEST_TERRA_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${TEST_TERRA_POSTGRES_PASSWORD:-changeme}
      MAINNET: "false"
      SERVICE_PORT: ${TEST_TERRA_DEFI_SERVICE_PORT:-5120}
    network_mode: host
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true
    depends_on:
      - postgres-testnet

networks:
  postgres:
    driver: bridge
  postgres-testnet:
    driver: bridge

volumes:
  postgres:
  postgres-test:
---
version: '3.5'
services:
  price-alert:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/price_alert
      dockerfile: Dockerfile
    command: [ "python", "./main.py" ]

  terra-defi:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: on-failure:5
    working_dir: /code
    command: [ "python", "./main.py" ]
    network_mode: host
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true
    depends_on:
      - terra-defi-api

  terra-defi-api:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: on-failure:5
    working_dir: /code
    command: [ "python", "./web_server.py" ]
    network_mode: host
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true

  terra-defi-api-js:
      build: # "context" and "dockerfile" fields have to be under "build"
        context: ./services/terra-defi-js
        dockerfile: Dockerfile
      restart: on-failure:5
      working_dir: /usr/src/app
      command: [ "npm", "run", "start:prod" ]
      volumes:
        - type: bind
          source: "./services/terra-defi-js/resources"
          target: /dist/resources
          volume:
            nocopy: true
      ports:
        - "5020:5020"
      networks:
        - postgres
      environment:
        - STAGE=docker
        - DB_HOST=postgres
        - DB_PORT=${POSTGRES_PORT:-5432}

  postgres:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
        - postgres:/data/postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:

---
version: '3'
services:
  postgres:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: ${TERRA_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TERRA_POSTGRES_PASSWORD:-changeme}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "${TERRA_POSTGRES_PORT:-5432}:5432"
    networks:
      - no-internet
      - internet
    restart: unless-stopped

  price-alert:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/price_alert
      dockerfile: Dockerfile
    restart: unless-stopped
    command: [ "python", "./price_alert.py" ]
    environment:
      DB_HOST: postgres
      DB_PORT: ${TERRA_POSTGRES_PORT:-5432}
      DB_NAME: ${TERRA_POSTGRES_DBNAME:-terra_defi}
      DB_USER: ${TERRA_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${TERRA_POSTGRES_PASSWORD:-changeme}
      API_SERVICE_HOST: http://terra-defi-api
      API_SERVICE_PORT: ${TERRA_DEFI_SERVICE_PORT:-5020}
      USE_TELEGRAM: "true"
      CHECK_DEFI_PRICE: "true"
      AUTO_BUY: ${TERRA_DEFI_AUTO_BUY:-true}
      AUTO_BUY_AMOUNT: ${TERRA_DEFI_AUTO_BUY_AMOUNT:-10000000}
    networks:
      - no-internet
      - internet
    depends_on:
      - terra-defi-api

  terra-defi:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /code
    command: [ "python", "./main.py" ]
    environment:
      DB_HOST: postgres
      DB_PORT: ${TERRA_POSTGRES_PORT:-5432}
      DB_NAME: ${TERRA_POSTGRES_DBNAME:-terra_defi}
      DB_USER: ${TERRA_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${TERRA_POSTGRES_PASSWORD:-changeme}
      MAINNET: ${TERRA_MAINNET:-true}
      API_SERVICE_HOST: http://terra-defi-api
      API_SERVICE_PORT: ${TERRA_DEFI_SERVICE_PORT:-5020}
    networks:
      - no-internet
      - internet
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true
    depends_on:
      - terra-defi-api

  terra-defi-api:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /code
    command: [ "python", "./web_server.py" ]
    environment:
      DB_HOST: postgres
      DB_PORT: ${TERRA_POSTGRES_PORT:-5432}
      DB_NAME: ${TERRA_POSTGRES_DBNAME:-terra_defi}
      DB_USER: ${TERRA_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${TERRA_POSTGRES_PASSWORD:-changeme}
      MAINNET: ${TERRA_MAINNET:-true}
      API_SERVICE_PORT: ${TERRA_DEFI_SERVICE_PORT:-5020}
    networks:
      - no-internet
      - internet
    ports:
      - "${TERRA_DEFI_SERVICE_PORT:-5020}:${TERRA_DEFI_SERVICE_PORT:-5020}"
    volumes:
      - type: bind
        source: "./services/terra_defi"
        target: /code
        volume:
          nocopy: true
    depends_on:
      - postgres

  terra-defi-ui:
    build: # "context" and "dockerfile" fields have to be under "build"
      context: ./services/terra_defi_ui
      dockerfile: Dockerfile
    restart: on-failure:5
    networks:
      - no-internet
      - internet
    ports:
      - "${TEST_TERRA_UI_PORT_HTTP:-5080}:80"
    environment:
      API_SERVICE_HOST: ${TERRA_DEFI_SERVICE_HOST:-http://terra-defi-api}
      API_SERVICE_PORT: ${TERRA_DEFI_SERVICE_PORT:-5020}
    depends_on:
      - terra-defi-api

networks:
  no-internet:
    driver: bridge
    internal: true
  internet:
    driver: bridge

volumes:
  postgres: